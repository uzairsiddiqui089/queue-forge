x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  # "production" hides the API docs and rejects weak database passwords at startup.
  ENVIRONMENT: ${ENVIRONMENT:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  # Tuning knobs. The real defaults live in src/queueforge/config.py; these are only the
  # ones forwarded from .env. Settings that do not make sense together stop the app at startup.
  WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-30}
  WORKER_HEARTBEAT_INTERVAL_SECONDS: ${WORKER_HEARTBEAT_INTERVAL_SECONDS:-10}
  WORKER_SWEEP_INTERVAL_SECONDS: ${WORKER_SWEEP_INTERVAL_SECONDS:-10}
  WORKER_SHUTDOWN_DRAIN_SECONDS: ${WORKER_SHUTDOWN_DRAIN_SECONDS:-25}
  RETRY_BASE_DELAY_SECONDS: ${RETRY_BASE_DELAY_SECONDS:-2}
  RETRY_MAX_DELAY_SECONDS: ${RETRY_MAX_DELAY_SECONDS:-300}
  RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
  MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-65536}
  MAX_QUEUED_JOBS_PER_CLIENT: ${MAX_QUEUED_JOBS_PER_CLIENT:-10000}
  MAX_QUEUED_JOBS_TOTAL: ${MAX_QUEUED_JOBS_TOTAL:-100000}
  RETENTION_SUCCEEDED_DAYS: ${RETENTION_SUCCEEDED_DAYS:-7}
  RETENTION_FAILED_DAYS: ${RETENTION_FAILED_DAYS:-30}
  RETENTION_DEAD_LETTER_DAYS: ${RETENTION_DEAD_LETTER_DAYS:-30}
  FAIR_CLAIMING: ${FAIR_CLAIMING:-true}
  FAIR_CLAIM_MAX_CLIENTS: ${FAIR_CLAIM_MAX_CLIENTS:-64}
  QUEUE_DEPTH_CACHE_SECONDS: ${QUEUE_DEPTH_CACHE_SECONDS:-1}
  METRICS_CACHE_SECONDS: ${METRICS_CACHE_SECONDS:-10}

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      # Bound to localhost only; not exposed to the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Used ONLY for API rate limiting (short-lived counters). Never stores jobs; the API keeps
  # working if it is down. No password here because it is bound to localhost for development;
  # in production, use a password and TLS.
  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Runs once: applies database migrations, then exits. The API and workers wait for it.
  migrate:
    build: .
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    restart: unless-stopped
    environment:
      <<: *app-env
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      # Liveness only (/healthz never touches the database).
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Scale with: docker compose up -d --scale worker=4
  worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "queueforge.worker"]
    environment: *app-env
    # Must be longer than WORKER_SHUTDOWN_DRAIN_SECONDS, so a stopping worker can finish or
    # hand back its current job before Docker kills it.
    stop_grace_period: 40s
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # The worker touches this file every few seconds while its loop is alive.
      test:
        - CMD
        - python
        - -c
        - "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('/tmp/queueforge-worker-alive') < 60 else 1)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Deletes old finished jobs (and their attempts, idempotency keys, notifications) in small
  # batches. Never touches queued or running jobs. See docs/operations.md.
  maintenance:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "queueforge.maintenance"]
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('/tmp/queueforge-maintenance-alive') < 300 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Backup and restore tools (run on demand; the `tools` profile keeps them out of a normal
  # `docker compose up`). Backups go to the `backups` volume: for real safety mount a path on
  # ANOTHER machine or disk instead, because a backup beside the database dies with it.
  #   docker compose --profile tools run --rm dbtools backup
  #   docker compose --profile tools run --rm dbtools drill
  dbtools:
    image: postgres:16
    profiles: ["tools"]
    entrypoint: ["bash", "/scripts/dbtools.sh"]
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      BACKUP_DIR: /backups
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
    volumes:
      - ./scripts/backup:/scripts:ro
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  backups:
  pgdata:

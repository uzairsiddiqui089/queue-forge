name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: queueforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d queueforge_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://ci:ci-only-password@localhost:5432/queueforge_test
      TEST_REDIS_URL: redis://localhost:6379/0
      REQUIRE_BACKUP_TOOLS: "1"
    steps:
      # Actions are pinned to a commit (the tag in the comment), so a moved tag cannot change CI.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: PostgreSQL client tools (the backup scripts and their tests need pg_dump and pg_restore)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - name: Shell scripts have no syntax errors
        run: shellcheck --severity=error scripts/backup/*.sh scripts/pitr/*.sh scripts/benchmark/*.sh
      - name: Compose files are valid (including the production override)
        env:
          POSTGRES_USER: ci
          POSTGRES_DB: ci
          POSTGRES_PASSWORD: ci-only-password
          REDIS_PASSWORD: ci-only-password
          QUEUEFORGE_DOMAIN: example.invalid
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile proxy config -q
          docker compose -f docker-compose.yml -f docker-compose.pitr.yml config -q
      - run: uv sync --frozen
      - name: Dependency vulnerability audit (runtime packages)
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project -o runtime-requirements.txt
          uvx pip-audit -r runtime-requirements.txt --no-deps --disable-pip
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Migrations match the models
        run: |
          uv run alembic upgrade head
          uv run alembic check
        env:
          DATABASE_URL: postgresql+psycopg://ci:ci-only-password@localhost:5432/queueforge_test
      - run: uv run pytest

  # Builds the real container image and scans it (operating-system packages and Python
  # libraries) for known vulnerabilities that already have a fix. HIGH and CRITICAL fail the job.
  image-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build the image
        run: docker build -t queueforge:ci .
      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: queueforge:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          vuln-type: os,library
